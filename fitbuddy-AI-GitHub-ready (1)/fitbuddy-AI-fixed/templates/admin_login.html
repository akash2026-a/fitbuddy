<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-admin-login">
  <h1>Admin Login</h1>
  <p>Enter the admin token to view all users.</p>
  <form action="/view-all-users" method="get">
    <label for="admin-token">Admin token
      <input type="password" id="admin-token" name="token" placeholder="Admin token" required>
    </label>
    <button type="submit">View Users</button>
  </form>
</body>
</html>
